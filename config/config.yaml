# ============================================================================
# PumpBot - SATU-SATUNYA Konfigurasi Strategi & Parameter
# ============================================================================
# Project hanya memakai file ini: config/config.yaml.
# Ubah parameter dan mode di sini; tidak ada profile demo/example/live lain
# atau override mode dari .env maupun command line.
# ============================================================================

# Mode operasi bot:
#   paper -> AKUN DEMO. Harga, volume, dan order book diambil dari pasar
#            Binance SUNGGUHAN lewat endpoint publik (tanpa API key),
#            tetapi saldo dan order sepenuhnya virtual. Mulai dari sini.
#   live  -> UANG SUNGGUHAN. Wajib API key di .env. Hanya setelah hasil
#            akun demo Anda konsisten selama berminggu-minggu.
mode: paper

# Mata uang quote yang dipakai trading (semua pair berakhiran USDT)
quote_asset: USDT

# ----------------------------------------------------------------------------
# AKUN DEMO (hanya dipakai saat mode: paper)
# ----------------------------------------------------------------------------
# Yang NYATA di mode paper : harga, volume, order book, trade, watchlist.
# Yang VIRTUAL di mode paper: saldo, order, posisi, dan seluruh PnL.
# Saldo demo tersimpan di data/pumpbot-paper.db, jadi tidak hilang saat
# bot dimatikan dan dinyalakan lagi.
# ----------------------------------------------------------------------------
paper:
  # Modal virtual saat akun demo pertama kali dibuat. Sesudah itu saldo
  # mengikuti hasil trading. Isi mendekati modal riil rencana Anda supaya
  # hasil uji tidak menipu (MIN_NOTIONAL Binance umumnya 5 USDT per order).
  start_balance: 1000.0

  # Slippage taker per sisi dalam basis point (10 bps = 0,1%).
  # Beli terisi di atas best ask, jual terisi di bawah best bid, sehingga
  # hasil demo sedikit lebih pesimistis daripada harga layar.
  slippage_bps: 2.0

  # true -> saldo dan aset virtual dikosongkan ulang ke start_balance setiap
  # bot dinyalakan. Berguna untuk mengulang eksperimen dari titik yang sama.
  # Histori trade di database TIDAK ikut terhapus.
  reset_on_start: false

# ----------------------------------------------------------------------------
# UNIVERSE - pemilihan koin yang dipantau
# ----------------------------------------------------------------------------
universe:
  # Jumlah koin maksimum yang dipantau sekaligus. 0 = semua koin yang
  # lolos filter di bawah. Nilai positif memilih koin dengan volume 24 jam
  # tertinggi. Perhatikan batas koneksi WebSocket bila hasilnya sangat banyak.
  max_symbols: 0

  # Volume quote 24 jam minimum (dalam satuan quote, 5_000_000 = 5 juta USDT)
  # supaya tidak memantau koin yang terlalu sepi / mudah dimanipulasi.
  min_quote_volume_24h: 10000000

  # Daftar simbol manual (mis. ["BTCUSDT","BNBUSDT"]). Jika diisi,
  # filter otomatis dilewati dan hanya simbol ini yang dipantau.
  include_symbols: []

  # Simbol yang selalu dikecualikan walau volumenya tinggi.
  exclude_symbols: []

  # Buang pair stabilcoin-vs-stabilcoin (USDCUSDT, FDUSDUSDT, dll) -
  # harganya nyaris tidak bergerak, tidak relevan untuk deteksi pump.
  exclude_stable_pairs: true

  # Buang leveraged token (BTCUP, ETHDOWN, BNBBULL, dll) - mekanisme harga
  # berbeda dan sering muncul "pump" palsu karena rebalancing harian.
  exclude_leveraged_tokens: true

  # Seberapa sering daftar koin di-refresh (menit).
  refresh_minutes: 15

# ----------------------------------------------------------------------------
# DATA - sumber data & buffer
# ----------------------------------------------------------------------------
data:
  # Interval candle untuk analisis sinyal.
  kline_interval: 1m

  # Jumlah candle historis yang diambil via REST saat start
  # (untuk baseline rata-rata volume/trade sebelum WebSocket aktif).
  history_candles: 120

  # Level order book yang dilanggan via partial depth stream (5/10/20).
  # 10 = hemat ~49% bandwidth orderbook vs 20.
  depth_levels: 10

  # Kecepatan update order book: 1000 (1 detik) atau 100 (100ms).
  # 1000ms jauh lebih ringan untuk CPU; 100ms hanya jika butuh presisi tinggi.
  depth_speed_ms: 1000

  # Buffer trade di memori (rolling window).
  trade_buffer_max: 5000      # maksimum jumlah trade yang disimpan per simbol
  trade_window_sec: 600       # window analisis trade (10 menit)

  # Berapa lama snapshot order book disimpan (untuk deteksi spoofing).
  book_history_sec: 15

# ----------------------------------------------------------------------------
# SIGNAL ENGINE - deteksi peluang pump
# ----------------------------------------------------------------------------
signal:
  # Skor gabungan minimum (0-100) sebelum bot boleh entry.
  # 70 = cukup selektif. Turunkan (60) untuk lebih banyak sinyal.
  score_threshold: 70.0

  # Setelah exit, simbol ini "dinginkan" dulu selama X menit
  # supaya tidak langsung masuk lagi di kondisi yang sama.
  cooldown_after_exit_min: 15

  # Seberapa sering skor dihitung ulang per simbol (detik).
  reevaluate_sec: 3

  # Data minimal sebelum simbol dinilai (candle 1m).
  min_candles: 30

  # ------------------- BOBOT TIAP DETECTOR -------------------
  # Skor akhir = rata-rata tertimbang dari detector di bawah,
  # dikurangi penalti manipulasi. Jumlah bobot bebas (dinormalisasi otomatis).
  weights:
    orderbook: 0.20       # ketimpangan bid/ask + deteksi wall
    trade_flow: 0.15      # lonjakan frekuensi trade + tekanan beli
    volume: 0.4          # lonjakan volume vs moving average
    whale: 0.15           # transaksi bandar + deteksi spoofing
    price_action: 0.6    # struktur tren, breakout, fibonacci (SINYAL UTAMA)

  # ------------------- DETEKSI MANIPULASI (filter negatif) -------------------
  manipulation:
    # Seberapa kuat skor manipulasi mengurangi skor akhir (0 = mati, 1 = maksimal).
    weight: 0.60
    # Jika skor manipulasi >= nilai ini, koin langsung di-VETO (tidak akan entry).
    veto_threshold: 0.70
    # Ambang kenaikan 24 jam (persen). Dibaca dari ticker 24 jam Binance
    # (priceChangePercent), sama seperti yang tampil di aplikasi.
    #
    # Cara kerjanya bertingkat, bukan gerbang mati:
    #   - di bawah ambang, penalti naik proporsional (kenaikan 6% dari
    #     ambang 10% menyumbang 42 dari 100 poin komponen c1),
    #   - menyentuh atau melewati ambang, komponen c1 langsung PENUH (100),
    #     sehingga skor sinyal terpotong 24% dan koin hanya bisa lolos bila
    #     skor dasarnya sangat kuat.
    # Nilai 10% dipilih karena koin yang sudah naik segitu dalam sehari
    # berisiko dump, sementara koin naik 6-10% masih punya ruang dan tetap
    # bisa lolos bila sinyal lainnya kuat. Angka terukur ada di README
    # bagian 6 (tools/backtest/README.md).
    max_change_24h_pct: 10
    # Pola pump-and-dump: naik >= 8% dalam window, lalu turun >= 40% dari kenaikan.
    pump_dump_gain_pct: 8
    pump_dump_pullback_pct: 40
    pump_dump_window_min: 15
    # Harga naik terlalu cepat 5 menit terakhir (>= 5%) = overextended,
    # entry di titik seperti ini berisiko membeli di puncak.
    overextended_5m_pct: 5
    # Wash trading: volume naik >= 2x tapi rentang harga <= 0.4% (harga diam).
    wash_volume_spike: 2.0
    wash_range_pct: 0.4

  # ------------------- DETECTOR ORDER BOOK -------------------
  orderbook:
    # Berapa level teratas yang dihitung untuk rasio bid/ask.
    imbalance_levels: 10
    # Skala sensitivitas: rasio bid 0.75 vs ask -> skor penuh (0.25 di atas netral 0.5).
    imbalance_scale: 0.25
    # Order dianggap "wall" jika qty-nya >= 10x median level lain.
    wall_ratio: 10
    # Wall dianggap relevan jika berada <= 1% dari harga pasar.
    wall_near_pct: 1.0

  # ------------------- DETECTOR FREKUENSI TRADE & LIKUIDITAS -------------------
  trade_flow:
    # Skala lonjakan: 4x rata-rata historis -> skor penuh.
    spike_scale: 3.0
    # Baseline rata-rata trade/menit dihitung dari X menit terakhir.
    baseline_minutes: 60
    # GATE wajib: spread maksimum (basis point). Lebih lebar dari ini = BATAL entry
    # (slippage tinggi, likuiditas buruk). 15 bps = 0.15%.
    max_spread_bps: 15

  # ------------------- DETECTOR VOLUME -------------------
  volume:
    # Skala lonjakan: volume 4x rata-rata -> skor penuh.
    spike_scale: 3.0
    # Moving average volume (jumlah candle).
    ma_period: 20

  # ------------------- DETECTOR BANDAR / WHALE -------------------
  whale:
    # Trade dianggap whale jika nilainya >= 8x rata-rata ukuran trade pair tsb...
    multiplier: 8
    # ... DAN minimal sebesar ini (USDT), biar tidak salah bilang di pair sepi.
    min_notional_usd: 10000
    # Normalisasi skor: net beli whale 50rb USDT dalam 3 menit -> skor penuh.
    net_normalize_usd: 50000
    window_min: 3
    # Spoofing: order >= 8x median muncul lalu hilang >= 80% dalam < 10 detik
    # tanpa tersentuh harga -> indikasi wall palsu.
    spoof_wall_ratio: 8
    spoof_drop_pct: 0.8

  # ------------------- DETECTOR PRICE ACTION & RETRACEMENT -------------------
  price_action:
    # Berapa candle terakhir yang dianalisis untuk struktur tren & swing.
    structure_candles: 30
    # Swing high/low = high/low yang lebih tinggi dari 2 candle di kiri-kanannya.
    swing_neighbors: 2
    # Breakout resistance = close > high tertinggi dari 20 candle sebelumnya.
    breakout_lookback: 20
    # Konfirmasi volume breakout: volume candle >= 1.5x MA20 volume.
    breakout_vol_confirm: 1.5
    # Zona retracement Fibonacci yang dianggap "golden zone" untuk entry aman.
    fib_zone: [0.382, 0.618]
    # Posisi harga di range 30 candle; >= 0.9 berarti menempel puncak.
    near_top_pct: 0.9

  # ------------------- GATE BAND PERUBAHAN 24 JAM (GATE ENTRY) -------------------
  # Hanya koin dengan BESAR perubahan 24 jam di dalam band ini yang boleh entry.
  # Ini gerbang keras, bukan penalti skor: koin di luar band tidak pernah
  # dibeli, berapa pun skor sinyalnya.
  #
  # Sumber angka: priceChangePercent dari ticker 24 jam Binance (harga
  # sekarang dibanding 24 jam bergulir ke belakang). Nilainya dipakai sebagai
  # NILAI ABSOLUT, sama seperti ManipulationDetector di repo ini, karena pump
  # dan dump diukur dengan ukuran yang sama. Jadi yang dinilai BESAR
  # pergerakannya, bukan arahnya:
  #   naik 6 sampai 10%  -> lolos
  #   turun 6 sampai 10% -> lolos juga (pergerakannya sama besar)
  #   tenang di bawah 6% -> ditolak
  #   di atas 10%        -> ditolak, naik berisiko beli di puncak dan turun
  #                         sedalam itu berarti pisau jatuh
  # Batas kedua ujung INKLUSIF (6% dan 10% sama-sama lolos).
  #
  # Pengaman tambahan untuk koin turun: penalti manipulasi 24 jam memakai
  # angka absolut yang sama, jadi koin turun 6 sampai 10% tetap dipotong
  # skornya dan butuh sinyal jauh lebih kuat untuk benar-benar tereksekusi.
  #
  # Kalau data ticker 24 jam belum tersedia, koin DITOLAK (fail-closed):
  # gate ini justru ada untuk mencegah entry tanpa tahu pergerakannya.
  # Dimatikan sementara tanpa restart lewat panel Parameter di dashboard.
  change_24h:
    enabled: true
    min_pct: 6.0
    max_pct: 10.0

  # ------------------- FILTER ANCHORED VWAP (GATE ENTRY) -------------------
  # VWAP berlabuh dari awal pump. BUKAN sumber skor: hanya boleh MEMBATALKAN
  # entry yang sudah lolos skor, veto, dan threshold. Semua parameter dihitung
  # dalam JUMLAH CANDLE, jadi pada kline_interval 1m satu candle = satu menit.
  vwap:
    # false -> perilaku bot persis seperti sebelum filter ini ada.
    enabled: true

    # Cara memilih candle anchor:
    #   pump_start  -> awal rantai lonjakan volume terbaru (disarankan)
    #   impulse_low -> candle dengan low terendah dalam window
    #   manual      -> dari manual_anchors di bawah
    anchor_mode: pump_start

    # Window pencarian anchor (60 candle = 60 menit pada 1m), cukup untuk
    # mencakup satu pump penuh.
    anchor_lookback_candles: 60

    # Candle dianggap "berlonjak" bila volumenya >= 3x rata-rata 20 candle
    # sebelumnya DAN candle-nya bullish (close > open).
    pump_volume_mult: 3.0
    pump_baseline_candles: 20

    # Dua lonjakan dianggap satu rantai bila jaraknya <= 3 candle.
    pump_max_gap_candles: 3

    # Bila tidak ada lonjakan di window: impulse_low atau block.
    no_anchor_action: impulse_low

    # Anchor manual per simbol, epoch milidetik UTC. Contoh:
    #   manual_anchors: {PEPEUSDT: 1758326400000}
    manual_anchors: {}

    # Zona entry yang diterima, jarak harga terhadap VWAP dalam persen
    # (batas inklusif). Di bawah min = penjual menguasai sejak pump,
    # di atas max = mengejar puncak.
    min_above_pct: 0.0
    max_above_pct: 8.0        # nilai awal, WAJIB dikalibrasi lewat backtest

    # Minimal candle sejak anchor sebelum VWAP dipercaya.
    min_anchor_candles: 3

    # Data kurang (candle sedikit, volume 0, harga tidak valid):
    #   block -> tolak entry (default, konsisten dengan detector lain)
    #   allow -> biarkan lewat
    on_insufficient_data: block

# ----------------------------------------------------------------------------
# RISK MANAGEMENT - manajemen risiko (BACA SEBELUM UBAH!)
# ----------------------------------------------------------------------------
risk:
  # Satu parameter risiko entry: persen dari BALANCE (bukan unrealized PnL).
  # Tidak ada batas atas software; angka berapa pun > 0 diterima.
  # Contoh: 1.0 = risk target 1% balance, 25.0 = 25% balance.
  # Di Spot, ukuran order tetap dibatasi saldo quote tersedia dan aturan exchange.
  risk_per_trade_pct: 100.0

  # Default aman: satu posisi saja. Set true untuk mengizinkan hingga 3 pair.
  allow_multiple_positions: false
  max_open_positions: 3

  # Opsional. Jika true, equity turun sebesar limit akan memblokir entry baru
  # sampai 00:00 UTC. Posisi yang sudah ada tetap dikelola.
  daily_loss_enabled: false
  daily_loss_limit_pct: 3.0

  # Estimasi fee taker Binance (%) untuk BE dan pencatatan PnL.
  fee_pct: 0.1

# ----------------------------------------------------------------------------
# ATR (Average True Range) - dasar jarak SL, TP, BE, dan trailing
# ----------------------------------------------------------------------------
# ATR = rata-rata True Range, yaitu ukuran volatilitas dalam SATUAN HARGA.
# Rumusnya Wilder (1978) dan dihitung dari candle TERTUTUP pada interval
# data.kline_interval di atas. Perlakukan blok ini sebagai "ukuran gelembung"
# pasar: makin gelembung, makin lebar jarak stop yang dipakai.
#
# Satu nilai ATR diambil saat entry lalu DIBEKUKAN untuk seluruh umur posisi
# (tersimpan di kolom trades.atr_entry), jadi SL/TP/BE/trailing sebuah posisi
# tidak bergerak hanya karena volatilitas berubah. Ini keputusan desain:
# risiko yang sudah diukur saat sizing tetap konsisten sampai posisi tutup.
#
# Pemakaian per komponen (semua berbasis ATR pada setelan bawaan):
#   SL        : stops.mode: atr        -> entry - stops.atr_multiplier x ATR
#   TP        : take_profit.mode: atr  -> entry + take_profit.atr_multiplier x ATR
#   BE        : breakeven.trigger_mode: auto -> mengikuti mode SL (basis ATR)
#   Trailing  : trailing.mode: atr     -> high - trailing.atr_multiplier x ATR
#
# Contoh terukur (Binance spot 1m, ATR Wilder 14, diambil 2026-10-02):
#   BTCUSDT harga 85.062,01  ATR 43,73 (0,051% harga)
#           SL 1,5 x ATR = 84.996,42   TP 3 x ATR = 85.193,18
#   SOLUSDT harga 119,92     ATR 0,0958 (0,080% harga)
#   ETHUSDT harga 2.686,00   ATR 1,4765 (0,055% harga)
# Koin yang sedang pump punya ATR jauh lebih besar (sering 1-3% harga), jadi
# jaraknya otomatis melebar tanpa perlu mengubah config per koin.
#
# PERHATIAN penting soal biaya: pada koin besar yang tenang, 1,5 x ATR bisa
# lebih SEMPIT daripada fee round-trip (2 x 0,1% = 0,2%). Stop yang lebih
# sempit daripada biaya berarti posisi sudah rugi bersih sebelum sempat
# bergerak. Untuk universe bot (koin pump) hal ini jarang terjadi, tapi
# sebelum dipakai di mode live, jalankan tools backtest dan periksa kolom
# trade yang kena SL: kalau mayoritas SL lebih kecil dari 0,2%, naikkan
# atr_multiplier atau pakai min_stop_pct yang lebih besar.
#
# Kalau ATR tidak bisa dihitung (candle tertutup kurang dari period + 1, atau
# data rusak), bot TIDAK diam-diam memakai angka nol: SL dan TP jatuh ke
# fallback percent/rr dan kejadian itu dicatat di log serta tabel events.
atr:
  # Jumlah candle untuk rata-rata True Range. 14 adalah nilai klasik Wilder.
  period: 14
  # wilder -> pemulusan RMA (identik ta.atr di TradingView, lebih halus)
  # sma    -> rata-rata sederhana (lebih reaktif ke lonjakan volatilitas)
  method: wilder

stops:
  # structure -> di bawah swing low terdekat
  # percent   -> persen tetap di bawah entry
  # atr       -> entry - (atr_multiplier x ATR), ukuran volatilitas pasar
  mode: atr
  # Jarak SL saat mode atr. 1.5 x ATR adalah kompromi umum: cukup jauh untuk
  # tahan noise 1 menit, cukup dekat agar ukuran posisi tidak mengecil.
  atr_multiplier: 1.5
  # Pengaman KHUSUS mode atr, satuannya kelipatan ATR. Kelipatan efektif
  # dijepit ke rentang ini.
  #
  # PENTING: pengaman ini tidak memakai min_stop_pct/max_stop_pct (persen).
  # Alasannya terukur: pada BTC 1m, 1.5 x ATR = 0,077% harga. Kalau batas
  # persen 0,5% dipaksakan, SL ikut melebar jadi 0,5% padahal TP berbasis
  # ATR tetap 0,154%, sehingga TP jadi LEBIH DEKAT daripada SL dan rasio
  # imbal 1:2 berubah jadi 1:0,3. Karena itu pengaman ATR memakai satuan
  # yang sama dengan basisnya.
  atr_min_multiplier: 0.5
  atr_max_multiplier: 4.0
  # percent_pct hanya dipakai saat mode percent (dan sebagai fallback bila
  # ATR tidak tersedia saat entry).
  percent_pct: 2.0
  structure_buffer_pct: 0.15
  # max_stop_pct tetap berlaku di mode atr sebagai batas atas MUTLAK: ATR
  # yang ekstrem (mis. koin baru listing) tidak boleh melebarkan risiko.
  # min_stop_pct hanya berlaku untuk mode percent/structure.
  min_stop_pct: 0.5
  max_stop_pct: 10.0

take_profit:
  # rr    -> TP = entry + rr x jarak SL (risk:reward)
  # multi -> beberapa target dari daftar targets di bawah
  # single-> hanya target pertama
  # atr   -> TP = entry + (atr_multiplier x ATR)
  mode: atr
  rr: 3.0
  # Dengan SL 1.5 x ATR dan TP 3 x ATR, imbal rasio tetap 1:2 berapa pun
  # nilai ATR-nya. Ubah salah satu kelipatan bila ingin rasio berbeda.
  atr_multiplier: 3.0

breakeven:
  enabled: true
  # auto -> ikut basis SL (stops.mode). SL atr berarti BE ikut atr.
  # rr   -> pemicu entry + trigger_rr x jarak SL awal (1R)
  # atr  -> pemicu entry + trigger_atr_mult x ATR
  trigger_mode: auto
  # Dipakai saat basis rr. 2.0 berarti BE baru aktif setelah untung 2R.
  trigger_rr: 2.0
  # Dipakai saat basis atr. 1.5 x ATR = 1R bila SL dipasang 1.5 x ATR.
  trigger_atr_mult: 1.5
  # Buffer minimal 2x fee tetap dipakai agar BE tidak rugi karena biaya.
  buffer_pct: 0.3

trailing:
  # Aktif otomatis segera setelah BE; SL terus naik mengikuti harga tertinggi.
  enabled: true
  # percent -> SL = highest x (1 - percent_pct%)
  # atr     -> SL = highest - (atr_multiplier x ATR yang dibekukan saat entry)
  mode: atr
  percent_pct: 1.0
  # 2 x ATR dari puncak: lebih longgar dari SL awal supaya tren yang sehat
  # tidak tertutup oleh koreksi normal.
  atr_multiplier: 2.0
  # SL hanya di-republish ke exchange kalau naik minimal sekian persen
  # (hemat rate limit Binance).
  update_step_pct: 0.15

execution:
  # Cara pasang exit order:
  #   oco    -> pakai OCO (One-Cancels-Other) di exchange: TP limit + SL stop-limit.
  #             Jika OCO gagal dipasang, otomatis fallback ke mode manual.
  #   manual -> bot sendiri yang mengawasi harga lalu kirim market sell.
  #             (bot mati = tidak ada proteksi SL di exchange!)
  exit_mode: oco

  # Jenis order entry: market (langsung tereksekusi) atau limit (lebih murah,
  # tapi berisiko tidak terisi; order dibatalkan jika tidak isi dalam timeout).
  entry_order_type: market
  limit_entry_timeout_sec: 20

  # SL stop-limit ditempatkan sedikit di bawah trigger agar pasti terisi
  # saat pasar jatuh cepat (persen di bawah stop price).
  oco_sl_limit_buffer_pct: 0.3

  # Seberapa sering status OCO di-exchange direkonsiliasi (detik).
  reconcile_sec: 5

  # Umur maksimum data pasar (detik) sebelum entry baru DIBLOKIR dan
  # pembaruan SL breakeven/trailing ditunda. Melindungi dari kondisi
  # "WebSocket terlihat hidup tetapi tidak ada data masuk" sehingga bot
  # tidak entry atau menggeser SL memakai harga basi.
  # 0 = gate dimatikan (tidak disarankan untuk mode live).
  max_data_age_sec: 90
  # Deteksi fill TP/SL seketika lewat User Data Stream (WebSocket API,
  # userDataStream.subscribe.signature). Mode live saja; bila gagal, bot
  # otomatis kembali memakai polling reconcile_sec di atas.
  user_data_stream: true
  # true = paksa endpoint OCO lama (POST /api/v3/order/oco) yang sudah
  # deprecated. Biarkan false kecuali endpoint baru bermasalah.
  oco_legacy_endpoint: false

# ----------------------------------------------------------------------------
# DASHBOARD WEB
# ----------------------------------------------------------------------------
dashboard:
  host: 127.0.0.1
  port: 8000

# ----------------------------------------------------------------------------
# DATABASE (SQLite). Untuk upgrade ke PostgreSQL nanti: lihat README bagian
# "Upgrade ke PostgreSQL".
# ----------------------------------------------------------------------------
database:
  # default -> otomatis dipisah per mode:
  #   mode paper -> data/pumpbot-paper.db
  #   mode live  -> data/pumpbot-live.db
  # Isi path sendiri kalau ingin mengatur manual (tidak dipisah otomatis).
  path: data/pumpbot.db

# ----------------------------------------------------------------------------
# LOGGING
# ----------------------------------------------------------------------------
logging:
  level: INFO
  file: logs/bot.log
  max_bytes: 10485760   # 10 MB per file
  backups: 5

# ----------------------------------------------------------------------------
# DUST SWEEP - konversi sisa koin kecil menjadi BNB (opsional)
# ----------------------------------------------------------------------------
# Sisa qty pembulatan setelah semua TP terjual (nilainya di bawah
# MIN_NOTIONAL, tidak bisa dijual biasa) otomatis dikonversi ke BNB
# lewat endpoint resmi Binance "Convert Dust to BNB" (binance-sdk-wallet).
# HANYA berjalan di mode LIVE (akun demo tidak punya aset BNB sungguhan).
